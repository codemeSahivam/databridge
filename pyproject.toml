[project]
name = "databridge"
version = "0.1.0"
description = "Private MCP server that gives Claude governed access to the company's Snowflake, Databricks and QuickSight."
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2",
    "sqlglot>=25",
    "boto3>=1.34",
    "snowflake-connector-python>=3.6",
    "databricks-sql-connector>=3.1",
    "databricks-sdk>=0.30",
    "cryptography>=42",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
databridge-mcp = "databridge.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
